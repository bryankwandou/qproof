[package]
name = "qproof_registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2.2"

# Tests run the compiled SBF binary (target/deploy/qproof_registry.so) inside
# LiteSVM. Build it first: `cargo build-sbf`, then `cargo test`.
[dev-dependencies]
litesvm = "0.17"
solana-account = "4.3"
solana-address = { version = "~2.7", features = ["curve25519", "decode"] }
solana-clock = "~3.2"
solana-instruction = "~3.5"
solana-instruction-error = "2.5"
solana-keypair = "3.1.2"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1.5"
solana-transaction-error = "~3.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
